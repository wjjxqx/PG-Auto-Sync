name: PG Incremental Sync (With Bootstrap)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y zip unzip diffutils

    - name: Fetch latest zip list
      run: |
        curl -s https://api.github.com/repos/fish2018/PG/contents/ \
        | jq -r '.[].name' | grep '\.zip$' > new_zips.txt

    - name: Download new zips
      run: |
        mkdir -p new
        while read zip; do
          echo "Download $zip"
          wget -q "https://raw.githubusercontent.com/fish2018/PG/main/$zip" -O "new/$zip"
        done < new_zips.txt

    - name: Extract (keep directory structure)
      run: |
        mkdir -p new_files
        for z in new/*.zip; do
          unzip -o "$z" -d new_files >/dev/null || true
        done

    - name: Detect first run & changes
      run: |
        mkdir -p last

        find new_files -type f | sort > new_list.txt

        # 判断是否是首次运行
        if [ ! -d last ] || [ -z "$(ls -A last)" ]; then
          echo "FIRST_RUN=true" >> $GITHUB_ENV
          find new_files -type f > changed_files.txt
          echo "First run: full pack"
        else
          find last -type f | sort > old_list.txt
          diff -ruN last new_files > diff.txt || true

          grep '^+++ ' diff.txt \
          | grep -v '/dev/null' \
          | awk '{print $2}' \
          | sed 's|^new_files/||' \
          > changed_files.txt

          if [ -s changed_files.txt ]; then
            echo "FIRST_RUN=false" >> $GITHUB_ENV
          else
            echo "NO_CHANGE=true" >> $GITHUB_ENV
          fi
        fi

    - name: Pack pg.zip
      if: env.NO_CHANGE != 'true'
      run: |
        rm -f pg.zip
        cd new_files
        zip -r ../pg.zip $(cat ../changed_files.txt)
        cd ..

    - name: Update README
      if: env.NO_CHANGE != 'true'
      run: |
        echo "# PG Incremental Sync" > README.md
        echo "" >> README.md
        echo "Last update: $(date -u '+%Y-%m-%d %H:%M UTC')" >> README.md
        echo "" >> README.md

        if [ "${FIRST_RUN}" = "true" ]; then
          echo "## Initial Full Package" >> README.md
        else
          echo "## Updated Files" >> README.md
        fi

        echo "" >> README.md
        echo "| Path |" >> README.md
        echo "|------|" >> README.md
        cat changed_files.txt | while read f; do
          echo "| \`$f\` |" >> README.md
        done

    - name: Rotate snapshot
      if: env.NO_CHANGE != 'true'
      run: |
        rm -rf last
        mv new_files last

    - name: Commit & Push
      if: env.NO_CHANGE != 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add pg.zip README.md last
        git commit -m "PG sync: $(wc -l < changed_files.txt) files"
        git push
